# Pagoda multi-tenant configuration for vLLM
# Pass to vLLM with: --pagoda-config pagoda_config.yaml

# Tenant identity: read from upstream gateway's X-Tenant-ID header
# Tenant config: fetched dynamically from MASS platform API

mass_api:
  url: "http://mass-internal/api"
  timeout_seconds: 2
  tenant_config_ttl_seconds: 300      # Normal cache TTL: 5 minutes
  stale_cache_ttl_seconds: 3600       # Degraded cache TTL: max 1 hour stale data

# Fallback defaults when MASS API has no config for a tenant
defaults:
  priority: normal
  qps_limit: 10
  concurrent_limit: 5
  kv_cache_block_quota: 100

# Global queue depth protection
queue:
  max_pending_requests: 1000
  warn_threshold_pct: 0.8
